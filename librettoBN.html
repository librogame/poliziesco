<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Assassinio sul Treno - Lucia Ferrari (B/N)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: white;
            padding: 20px;
            font-family: 'Georgia', 'Times New Roman', serif;
        }
        
        .page {
            width: 210mm;
            min-height: 297mm;
            margin: 0 auto 20px auto;
            padding: 18mm 18mm;
            background: white;
            box-sizing: border-box;
            position: relative;
            border: 1px solid black;
            font-size: 11pt;
            line-height: 1.5;
            color: black;
            text-align: left;
        }
        
        @media print {
            body {
                background: white;
                padding: 0;
            }
            .page {
                margin: 0;
                border: 1px solid black;
                page-break-after: always;
                background: white;
            }
            .no-print {
                display: none;
            }
        }
        
        .header {
            margin-bottom: 25px;
            padding-bottom: 8px;
            border-bottom: 1px solid black;
            text-align: right;
        }
        .ref-number {
            font-size: 9pt;
            font-weight: normal;
            letter-spacing: 1px;
            font-style: italic;
            color: #333;
        }
        .ref-date {
            font-size: 9pt;
            margin-top: 4px;
            color: #333;
            font-style: italic;
        }
        
        .scene-title {
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin: 28px 0 20px 0;
            font-size: 14pt;
            text-align: center;
            font-style: normal;
        }
        
        .action {
            margin: 12px 0;
            text-align: left;
            font-style: italic;
            font-size: 10.5pt;
            color: #222;
        }
        
        .dialogue {
            margin: 12px 0 12px 20px;
            text-align: left;
        }
        
        .speaker {
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 10.5pt;
        }
        
        .pause {
            margin: 16px 0;
            text-align: center;
        }
        
        .pause-dots {
            font-size: 18pt;
            letter-spacing: 8px;
            font-weight: bold;
            color: #111;
        }
        
        .choices {
            margin: 32px 0 20px 0;
            padding: 18px;
            background: #f8f8f8;
            border: 1px solid black;
            text-align: left;
        }
        
        .choices-title {
            font-weight: bold;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 10pt;
            text-align: center;
        }
        
        .choice {
            margin: 10px 0;
            padding: 5px 0 5px 12px;
            border-left: 2px solid black;
        }
        
        .choice button {
            background: none;
            border: none;
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: 10.5pt;
            color: black;
            cursor: pointer;
            text-align: left;
            padding: 0;
            margin: 0;
            font-weight: normal;
            font-style: italic;
            text-decoration: underline;
        }
        
        .choice button:hover {
            text-decoration: none;
        }
        
        .default-choice {
            margin-top: 14px;
            padding-top: 8px;
            border-top: 1px dotted #999;
            color: #555;
            font-style: italic;
            font-size: 9.5pt;
        }
        
        .signature {
            margin-top: 45px;
            text-align: right;
            border-top: 1px solid black;
            padding-top: 12px;
            font-size: 9pt;
            font-style: italic;
        }
        
        .page-number {
            position: absolute;
            bottom: 15mm;
            right: 18mm;
            font-size: 9pt;
            color: #666;
        }
        
        .cover {
            text-align: center;
            padding-top: 80px;
        }
        
        .stamp {
            font-size: 9pt;
            letter-spacing: 4px;
            border: 1px solid black;
            display: inline-block;
            padding: 4px 16px;
            margin-bottom: 50px;
            font-style: italic;
        }
        
        .cover-title {
            font-size: 28pt;
            font-weight: bold;
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-top: 30px;
        }
        
        .cover-subtitle {
            font-size: 12pt;
            margin: 20px 0 40px 0;
            letter-spacing: 2px;
            font-style: italic;
        }
        
        .cover-line {
            width: 80px;
            margin: 30px auto;
            border-top: 1px solid black;
        }
        
        .cover-name {
            font-size: 16pt;
            font-weight: bold;
            text-transform: uppercase;
            margin-top: 40px;
            letter-spacing: 2px;
        }
        
        .cover-role {
            font-size: 10pt;
            margin-top: 8px;
            font-style: italic;
            color: #333;
        }
        
        .start-button {
            display: inline-block;
            margin-top: 50px;
            padding: 12px 32px;
            background: black;
            color: white;
            font-weight: bold;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            border: 1px solid black;
        }
        
        .start-button:hover {
            background: #333;
        }
        
        .no-print {
            text-align: center;
            margin-bottom: 25px;
            position: sticky;
            top: 10px;
            z-index: 100;
        }
        
        .no-print button {
            background: black;
            color: white;
            border: 1px solid black;
            font-family: monospace;
            font-size: 11pt;
            padding: 10px 24px;
            cursor: pointer;
        }
        
        @page {
            size: A4;
            margin: 0;
        }
        
        .hidden-scene {
            display: none;
        }
        
        .error-message {
            color: black;
            text-align: center;
            padding: 50px;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="no-print">
    <button onclick="window.print()">STAMPA PDF</button>
</div>

<div id="coverPage" class="page">
    <div class="cover">
        <div class="stamp">CLASSIFICATO</div>
        <div class="cover-title">ASSASSINIO</div>
        <div class="cover-title">SUL TRENO</div>
        <div class="cover-line"></div>
        <div class="cover-subtitle">libretto di</div>
        <div class="cover-name">LUCIA FERRARI</div>
        <div class="cover-role">Ispettore della polizia giudiziaria</div>
        <div class="cover-line"></div>
        <div style="margin-top: 50px; font-size: 9pt; letter-spacing: 2px; font-style: italic;">ARCHIVIO CENTRALE</div>
        <div style="font-size: 9pt; font-style: italic;">Dossier n. 2024-01</div>
        <div class="start-button" onclick="startGame()">▶ INIZIA</div>
    </div>
    <div class="page-number">1</div>
</div>

<div id="sceneContainer"></div>

<script>
    let scenesData = {};
    let scenesLoaded = false;

    async function loadScenes() {
        try {
            const response = await fetch('scene.txt');
            if (!response.ok) throw new Error('File scene.txt non trovato');
            const text = await response.text();
            parseScenes(text);
            scenesLoaded = true;
            buildAllScenes();
        } catch (error) {
            document.getElementById('sceneContainer').innerHTML = '<div class="page"><div class="error-message">⚠️ Errore: file scene.txt non trovato.<br>Assicurati che sia nella stessa cartella di questo file HTML.</div></div>';
        }
    }

    function parseScenes(content) {
        const lines = content.split('\n');
        let currentScene = null;
        for (let line of lines) {
            line = line.trim();
            if (line === '') continue;
            if (line.startsWith('[SCENA ') && line.endsWith(']')) {
                const match = line.match(/\[SCENA (\d+)\]/);
                if (match) {
                    currentScene = {
                        id: parseInt(match[1]),
                        title: '',
                        content: [],
                        choices: [],
                        defaultScene: null
                    };
                    scenesData[currentScene.id] = currentScene;
                }
            } else if (currentScene) {
                if (line.startsWith('titolo:')) currentScene.title = line.substring(7).trim();
                else if (line.startsWith('testo:')) currentScene.content.push({ type: 'action', text: line.substring(6).trim() });
                else if (line.startsWith('dialogo:')) {
                    let dialogText = line.substring(8).trim();
                    let colonPos = dialogText.indexOf(':');
                    if (colonPos !== -1) {
                        let speaker = dialogText.substring(0, colonPos).trim();
                        let text = dialogText.substring(colonPos + 1).trim();
                        currentScene.content.push({ type: 'dialogue', speaker: speaker, text: text });
                    } else {
                        currentScene.content.push({ type: 'dialogue', speaker: '', text: dialogText });
                    }
                } else if (line === '...') currentScene.content.push({ type: 'pause' });
                else if (line.startsWith('scelta:')) {
                    let choiceLine = line.substring(7).trim();
                    let arrowPos = choiceLine.indexOf('→');
                    if (arrowPos !== -1) {
                        let label = choiceLine.substring(0, arrowPos).trim();
                        let target = parseInt(choiceLine.substring(arrowPos + 1).trim());
                        currentScene.choices.push({ label: label, target: target });
                    }
                } else if (line.startsWith('default:')) {
                    currentScene.defaultScene = parseInt(line.substring(8).trim());
                }
            }
        }
    }

    function buildAllScenes() {
        const container = document.getElementById('sceneContainer');
        container.innerHTML = '';
        for (let id in scenesData) {
            container.appendChild(createSceneDiv(scenesData[id]));
        }
    }

    function createSceneDiv(scene) {
        const div = document.createElement('div');
        div.className = 'page hidden-scene';
        div.id = 'scena' + scene.id;

        const header = document.createElement('div');
        header.className = 'header';
        const ref = document.createElement('div');
        ref.className = 'ref-number';
        ref.textContent = 'RAPPORTO INVESTIGATIVO N. 2024-01/' + (scene.id < 10 ? '0' + scene.id : scene.id);
        const date = document.createElement('div');
        date.className = 'ref-date';
        date.textContent = 'DATA: 23 novembre 2024 — notturno';
        header.appendChild(ref);
        header.appendChild(date);
        div.appendChild(header);

        const title = document.createElement('div');
        title.className = 'scene-title';
        title.textContent = scene.title;
        div.appendChild(title);

        for (let item of scene.content) {
            if (item.type === 'action') {
                let p = document.createElement('div');
                p.className = 'action';
                p.textContent = item.text;
                div.appendChild(p);
            } else if (item.type === 'dialogue') {
                let d = document.createElement('div');
                d.className = 'dialogue';
                if (item.speaker) {
                    let span = document.createElement('span');
                    span.className = 'speaker';
                    span.textContent = item.speaker + '.';
                    d.appendChild(span);
                    d.appendChild(document.createTextNode(' "' + item.text + '"'));
                } else {
                    d.textContent = '"' + item.text + '"';
                }
                div.appendChild(d);
            } else if (item.type === 'pause') {
                let pDiv = document.createElement('div');
                pDiv.className = 'pause';
                let dots = document.createElement('span');
                dots.className = 'pause-dots';
                dots.textContent = '• • •';
                pDiv.appendChild(dots);
                div.appendChild(pDiv);
            }
        }

        if (scene.choices.length) {
            let box = document.createElement('div');
            box.className = 'choices';
            let boxTitle = document.createElement('div');
            boxTitle.className = 'choices-title';
            boxTitle.textContent = 'decisione operativa';
            box.appendChild(boxTitle);
            for (let ch of scene.choices) {
                let cDiv = document.createElement('div');
                cDiv.className = 'choice';
                let btn = document.createElement('button');
                btn.textContent = ch.label + ' → SCENA ' + ch.target;
                btn.onclick = () => showScene(ch.target);
                cDiv.appendChild(btn);
                box.appendChild(cDiv);
            }
            if (scene.defaultScene) {
                let defDiv = document.createElement('div');
                defDiv.className = 'default-choice';
                defDiv.textContent = '[Default] Tempo scaduto → SCENA ' + scene.defaultScene;
                box.appendChild(defDiv);
            }
            div.appendChild(box);
        }

        let sig = document.createElement('div');
        sig.className = 'signature';
        sig.innerHTML = '<div>Redatto da: LUCIA FERRARI</div><div class="signature-line">___________________</div>';
        div.appendChild(sig);

        let pNum = document.createElement('div');
        pNum.className = 'page-number';
        pNum.textContent = '— ' + (scene.id + 1) + ' —';
        div.appendChild(pNum);
        return div;
    }

    function showScene(id) {
        document.getElementById('coverPage').style.display = 'none';
        for (let k in scenesData) document.getElementById('scena' + k)?.classList.add('hidden-scene');
        let target = document.getElementById('scena' + id);
        if (target) {
            target.classList.remove('hidden-scene');
            target.scrollIntoView({ behavior: 'smooth' });
        } else alert('Scena ' + id + ' non trovata');
    }

    function startGame() {
        if (scenesLoaded && scenesData[1]) showScene(1);
        else if (!scenesLoaded) setTimeout(() => scenesData[1] ? showScene(1) : alert('Riattendi'), 1000);
        else alert('Scena 1 mancante');
    }

    window.showScene = showScene;
    window.startGame = startGame;
    loadScenes();
</script>
</body>
</html>
